---
# Test playbook for AAPRFE-409 galaxy_update_on_launch feature

- name: Test Galaxy Cache Feature (AAPRFE-409)
  hosts: localhost
  gather_facts: false
  connection: local

  tasks:
    - name: Display test information
      ansible.builtin.debug:
        msg: |
          ========================================
          Testing AAPRFE-409: galaxy_update_on_launch
          ========================================

          This test verifies that the galaxy_update_on_launch
          project setting correctly passes the --no-cache flag
          to ansible-galaxy collection install.

          Collections used:
            - community.general
            - ansible.posix

          To verify the feature:
          1. Check the PROJECT UPDATE job output (not this playbook!)
          2. Look for: ansible-galaxy collection install
          3. With feature OFF: No --no-cache flag
          4. With feature ON: --no-cache flag present

    - name: Verify community.general is available
      ansible.builtin.command:
        cmd: ansible-galaxy collection list community.general
      register: general_check
      changed_when: false
      failed_when: false

    - name: Verify ansible.posix is available
      ansible.builtin.command:
        cmd: ansible-galaxy collection list ansible.posix
      register: posix_check
      changed_when: false
      failed_when: false

    - name: Display results
      ansible.builtin.debug:
        msg: |
          Collection Status:
          - community.general: {{ 'Available' if general_check.rc == 0 else 'Not found' }}
          - ansible.posix: {{ 'Available' if posix_check.rc == 0 else 'Not found' }}

    - name: Success message
      ansible.builtin.debug:
        msg: |
          ========================================
          ✅ Test Complete!
          ========================================

          Collections are installed.

          IMPORTANT: To verify AAPRFE-409, you must check the
          PROJECT UPDATE job output, not this playbook output!

          Look for the ansible-galaxy collection install command
          and verify the --no-cache flag appears when the feature
          is enabled.
